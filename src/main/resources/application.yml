server:
  port: 8080

spring:
  application:
    name: fraud-detection-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:mem:frauddetectiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

resilience4j:
  circuitbreaker:
    instances:
      redisVelocityTracker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Regras configuráveis do Motor Antifraude
fraud:
  security:
    api-key: "fraud-secret-key-2026"
  messaging:
    enabled: false
    listener:
      enabled: false
  redis:
    enabled: false
  rules:
    high-amount:
      threshold-suspicious: 5000.00
      threshold-critical: 20000.00
    velocity:
      time-window-minutes: 5
      max-transactions: 3
    night-window:
      start-hour: 22
      end-hour: 6
      high-amount-threshold: 1000.00
    geolocation:
      max-speed-kmh: 800.0
      min-distance-km: 50.0
    behavioral:
      z-score-threshold: 3.0
      min-history-count: 3
    smurfing:
      min-amount: 4500.00
      max-amount: 4999.99
      min-recent-txs: 2